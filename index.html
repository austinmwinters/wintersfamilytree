<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Ccircle%20cx%3D%2216%22%20cy%3D%2216%22%20r%3D%2215%22%20fill%3D%22%231f5d66%22/%3E%3Cpath%20d%3D%22M16%206v20M6%2016h20%22%20stroke%3D%22%23eef1ee%22%20stroke-width%3D%222%22/%3E%3Ccircle%20cx%3D%2216%22%20cy%3D%2216%22%20r%3D%225%22%20fill%3D%22none%22%20stroke%3D%22%23eef1ee%22%20stroke-width%3D%222%22/%3E%3C/svg%3E"><meta property="og:title" content="Winters &amp; Papesch Family Atlas"><meta property="og:description" content="Four family lines, 21 generations, mapped from Sicily, Vienna, Poland, Switzerland and Dorset to Oklahoma and Chicago."><meta property="og:url" content="https://wintersfamilytree.xyz/"><meta name="theme-color" content="#eef1ee" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#111719" media="(prefers-color-scheme: dark)"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Winters & Papesch Family Atlas</title>
<meta name="description" content="Four family lines, 21 generations, mapped from Sicily, Vienna, Poland, Switzerland and Dorset to Oklahoma and Chicago.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: an atlas. A reading panel on the left, the map (or fan chart) filling the rest; on phones the map sits above the panel. */
:root {
  --paper: #eef1ee;        /* page ground: cool survey-paper */
  --panel: #f7f8f6;
  --ink: #1c2427;
  --muted: #5b686b;
  --rule: #ccd4d2;
  --sea: #d4e0e2;
  --land: #f6f6f1;
  --border: #b4bfbe;
  --focus: #1f5d66;        /* UI accent: deep verdigris */
  --winters: #b4472f;      /* the four grandparent lines */
  --creamer: #b98516;
  --papesch: #2c6c9c;
  --rusin: #6d5aa8;
  --ok: #2f7a4f;
  --warn: #a0620b;
  --bad: #b23a3a;
  --font-display: "IM Fell English", "Iowan Old Style", Georgia, serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --panel-w: 420px;
  --hdr-h: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111719; --panel: #151c1e; --ink: #e5ebe9; --muted: #95a3a4; --rule: #2a3436;
    --sea: #0d1719; --land: #1c2528; --border: #3a4749; --focus: #79c2c9;
    --winters: #e27c62; --creamer: #e2b450; --papesch: #72aadd; --rusin: #a898e2;
    --ok: #6cc28f; --warn: #e0a54a; --bad: #ec7d7d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111719; --panel: #151c1e; --ink: #e5ebe9; --muted: #95a3a4; --rule: #2a3436;
  --sea: #0d1719; --land: #1c2528; --border: #3a4749; --focus: #79c2c9;
  --winters: #e27c62; --creamer: #e2b450; --papesch: #72aadd; --rusin: #a898e2;
  --ok: #6cc28f; --warn: #e0a54a; --bad: #ec7d7d; color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font: 16px/1.55 var(--font-body); margin: 0; }
a { color: var(--focus); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* ---------- shell */
.app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
header.top {
  display: flex; align-items: center; gap: 24px; padding-inline: 20px; min-height: var(--hdr-h);
  border-bottom: 1px solid var(--rule); background: var(--panel); position: relative; z-index: 3;
}
.mark { display: flex; flex-direction: column; line-height: 1; text-decoration: none; color: var(--ink); flex-shrink: 0; }
.mark b { font: 400 1.45rem/1 var(--font-display); letter-spacing: .01em; }
.mark span { font: 500 .62rem/1 var(--font-mono); letter-spacing: .22em; text-transform: uppercase; color: var(--muted); margin-top: 5px; }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
nav.tabs a {
  padding: 8px 12px; border-radius: 6px; text-decoration: none; color: var(--muted); font-weight: 700; font-size: .92rem; white-space: nowrap;
}
nav.tabs a:hover { color: var(--ink); background: color-mix(in srgb, var(--ink) 6%, transparent); }
nav.tabs a[aria-current="page"] { color: var(--ink); background: color-mix(in srgb, var(--focus) 14%, transparent); }

.main { display: grid; grid-template-columns: var(--panel-w) 1fr; min-height: 0; }
.panel { overflow-y: auto; background: var(--panel); border-right: 1px solid var(--rule); min-width: 0; }
.panel-inner { padding: 22px 24px 48px; display: flex; flex-direction: column; gap: 18px; }
.stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: var(--sea); }
.stage svg { display: block; width: 100%; height: 100%; touch-action: none; }

@media (max-width: 860px) {
  :root { --hdr-h: auto; }
  header.top { flex-direction: column; align-items: stretch; gap: 8px; padding: 10px 16px 6px; position: sticky; top: env(safe-area-inset-top, 0px); }
  nav.tabs { margin-inline: -8px; }
  .app { display: block; height: auto; }
  .main { display: flex; flex-direction: column; }
  .stage { height: 52vh; min-height: 300px; order: 0; }
  .panel { overflow: visible; border-right: 0; border-top: 1px solid var(--rule); order: 1; }
  .panel-inner { padding: 20px 16px 48px; }
}

/* ---------- type */
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; text-wrap: balance; margin: 0; letter-spacing: .005em; }
h1 { font-size: 2rem; line-height: 1.1; }
h2 { font-size: 1.7rem; line-height: 1.12; }
h3 { font-size: 1.2rem; line-height: 1.2; }
p { margin: 0; }
.eyebrow { font: 500 .7rem/1.3 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.lede { color: var(--muted); font-size: 1.02rem; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.small { font-size: .88rem; }
.muted { color: var(--muted); }
.prose { display: flex; flex-direction: column; gap: 12px; max-width: 65ch; }
.prose ul { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; }
.section { display: flex; flex-direction: column; gap: 10px; }
.section > h3 { padding-bottom: 6px; border-bottom: 1px solid var(--rule); }
.back { align-self: flex-start; background: none; border: 0; padding: 0; color: var(--focus); cursor: pointer; font-weight: 700; font-size: .9rem; }

/* ---------- small parts */
.swatch { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.pill { display: inline-flex; align-items: center; gap: 6px; font: 500 .72rem/1 var(--font-mono); letter-spacing: .06em; text-transform: uppercase;
  padding: 5px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.pill.documented, .pill.proven { color: var(--ok); }
.pill.unsourced, .pill.partly-proven { color: var(--muted); }
.pill.questionable, .pill.tradition, .pill.needs-proof { color: var(--warn); }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--rule);
  background: var(--panel); cursor: pointer; font-weight: 700; font-size: .9rem; color: var(--ink); text-decoration: none; }
.btn:hover { border-color: var(--focus); }
.btn.primary { background: var(--focus); border-color: var(--focus); color: var(--panel); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--rule);
  background: var(--panel); font-size: .88rem; cursor: pointer; text-decoration: none; color: var(--ink); }
.chip:hover { border-color: var(--focus); }
.chip[aria-pressed="false"] { opacity: .45; }
.chip[aria-pressed="false"] .swatch { background: transparent !important; border: 1px solid var(--muted); }

.note { border-left: 3px solid var(--warn); padding: 8px 12px; background: color-mix(in srgb, var(--warn) 8%, transparent); font-size: .92rem; border-radius: 0 6px 6px 0; }
.note.q { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 7%, transparent); }

/* lists */
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.list > li { border-top: 1px solid var(--rule); }
.list > li:first-child { border-top: 0; }
.prow { display: grid; grid-template-columns: 10px 1fr auto; gap: 4px 12px; align-items: baseline; padding: 9px 2px; text-decoration: none; color: var(--ink); }
.prow:hover .pname { color: var(--focus); }
.prow .swatch { align-self: center; }
.prow .pname { font-weight: 700; min-width: 0; }
.prow .pmeta { grid-column: 2 / 4; color: var(--muted); font-size: .86rem; }
.prow .yrs { font: .82rem var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.flagdot { color: var(--warn); font-weight: 700; }

/* timeline of a life */
.life { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0; }
.life li { display: grid; grid-template-columns: 74px 1fr; gap: 12px; padding: 7px 0; border-top: 1px dashed var(--rule); }
.life li:first-child { border-top: 0; }
.life .when { font: .82rem/1.5 var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.life .what b { font-weight: 700; }
.placebtn { background: none; border: 0; padding: 0; color: var(--focus); cursor: pointer; text-align: left; font-size: .94rem; text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--focus) 35%, transparent); text-underline-offset: 3px; }

/* line cards on the home view */
.lines { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.linecard { border: 1px solid var(--rule); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 4px; background: var(--panel); cursor: pointer; text-align: left; position: relative; overflow: hidden; }
.linecard::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--c); }
.linecard:hover { border-color: var(--c); }
.linecard strong { font: 400 1.2rem/1.1 var(--font-display); }
.linecard span { font-size: .82rem; color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
.stats div { background: var(--panel); padding: 10px 12px; }
.stats b { display: block; font: 400 1.6rem/1 var(--font-display); }
.stats span { font-size: .78rem; color: var(--muted); }

.storycard { display: flex; flex-direction: column; gap: 6px; padding: 14px 0; border-top: 1px solid var(--rule); text-decoration: none; color: var(--ink); }
.storycard:first-child { border-top: 0; padding-top: 0; }
.storycard h3 { color: var(--ink); }
.storycard:hover h3 { color: var(--focus); }

input[type="search"] { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); font: inherit; }
details { border-top: 1px solid var(--rule); padding-top: 8px; }
details summary { cursor: pointer; font-weight: 700; }
.srcs { list-style: none; padding: 0; margin: 8px 0 0; display: flex; flex-direction: column; gap: 8px; font-size: .86rem; }
.srcs li span { display: block; color: var(--muted); font-family: var(--font-mono); font-size: .75rem; overflow-wrap: anywhere; }

/* ---------- map overlay */
.overlay { position: absolute; z-index: 2; pointer-events: none; }
.overlay > * { pointer-events: auto; }
.ov-lines { top: 12px; left: 12px; right: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
.ov-lines .chip { background: color-mix(in srgb, var(--panel) 92%, transparent); backdrop-filter: blur(4px); }
.ov-year { left: 12px; right: 12px; bottom: 12px; display: flex; align-items: center; gap: 10px;
  background: color-mix(in srgb, var(--panel) 92%, transparent); backdrop-filter: blur(4px); border: 1px solid var(--rule); border-radius: 10px; padding: 8px 12px; max-width: 560px; }
.ov-year input { flex: 1; min-width: 0; accent-color: var(--focus); }
.ov-year .yr { font: 400 1.5rem/1 var(--font-display); min-width: 4.2ch; text-align: right; font-variant-numeric: tabular-nums; }
.iconbtn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--rule); background: var(--panel); cursor: pointer; display: grid; place-items: center; flex-shrink: 0; }
.iconbtn:hover { border-color: var(--focus); }
.ov-zoom { right: 12px; top: 56px; display: flex; flex-direction: column; gap: 6px; }
.ov-hint { right: 12px; bottom: 74px; font-size: .8rem; color: var(--muted); background: color-mix(in srgb, var(--panel) 90%, transparent); padding: 4px 8px; border-radius: 6px; }
.ov-tree { top: 12px; left: 12px; right: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.ov-tree .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); background: color-mix(in srgb, var(--panel) 90%, transparent); padding: 6px 10px; border-radius: 8px; }
.tip { position: absolute; z-index: 4; pointer-events: none; background: var(--ink); color: var(--panel); padding: 6px 9px; border-radius: 6px; font-size: .82rem; max-width: 260px; line-height: 1.35; }
.tip b { display: block; }

/* map marks */
.ocean { fill: var(--sea); }
.landmass { fill: var(--land); stroke: none; }
.borders { fill: none; stroke: var(--border); stroke-width: .7; vector-effect: non-scaling-stroke; }
.states { fill: none; stroke: var(--border); stroke-width: .5; stroke-dasharray: 2 2; vector-effect: non-scaling-stroke; opacity: .8; }
.grat { fill: none; stroke: var(--border); stroke-width: .4; opacity: .35; vector-effect: non-scaling-stroke; }
.oceanlabel { font-family: var(--font-display); font-style: italic; fill: var(--muted); letter-spacing: .3em; opacity: .65; }
.dot { stroke: var(--panel); stroke-width: 1; vector-effect: non-scaling-stroke; cursor: pointer; }
.dot.mixed { stroke: var(--ink); }
.dot.dim { opacity: .18; }
.dot.past { opacity: .4; }
.dot.hl { stroke: var(--ink); stroke-width: 2; }
.plabel { font-family: var(--font-body); font-weight: 700; fill: var(--ink); paint-order: stroke; stroke: var(--land); stroke-linejoin: round; pointer-events: none; }
.route { fill: none; stroke-width: 2.2; vector-effect: non-scaling-stroke; stroke-linecap: round; }
.routenum { font-family: var(--font-mono); font-weight: 500; fill: var(--panel); pointer-events: none; text-anchor: middle; dominant-baseline: central; }
.me { fill: var(--focus); stroke: var(--panel); stroke-width: 2; vector-effect: non-scaling-stroke; }
.mering { fill: none; stroke: var(--focus); stroke-dasharray: 4 4; vector-effect: non-scaling-stroke; }

/* fan chart */
.fan path.w { stroke: var(--panel); stroke-width: 1; cursor: pointer; }
.fan path.w:hover { filter: brightness(1.08); }
.fan path.empty { fill: none; stroke: var(--border); stroke-dasharray: 3 3; cursor: default; }
.fan path.private { fill: color-mix(in srgb, var(--muted) 18%, var(--paper)); cursor: default; }
.fan path.sel { stroke: var(--ink); stroke-width: 2.5; }
.fan .hatch { pointer-events: none; }
.fan text { font-family: var(--font-body); fill: var(--ink); pointer-events: none; }
.fan text.n { font-weight: 700; }
.fan text.y { font-family: var(--font-mono); fill: var(--muted); }
.fan .center text { font-family: var(--font-display); }
.treebg { fill: var(--paper); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="app">
  <header class="top">
    <a class="mark" href="#map"><b>Winters &amp; Papesch</b><span>Family Atlas</span></a>
    <nav class="tabs" aria-label="Sections">
      <a href="#map" data-tab="map">Map</a>
      <a href="#tree" data-tab="tree">Tree</a>
      <a href="#stories" data-tab="stories">Stories</a>
      <a href="#people" data-tab="people">People</a>
      <a href="#near" data-tab="near">Near me</a>
      <a href="#about" data-tab="about">About</a>
    </nav>
  </header>
  <div class="main">
    <aside class="panel" id="panel" aria-live="polite"><div class="panel-inner" id="panelInner"><p class="muted">Loading the family…</p></div></aside>
    <section class="stage" id="stage" aria-label="Map">
      <svg id="map" role="img" aria-label="Map of places in the family's history"></svg>
      <svg id="fan" role="img" aria-label="Fan chart of ancestors" hidden></svg>
      <div class="overlay ov-lines" id="ovLines"></div>
      <div class="overlay ov-zoom" id="ovZoom">
        <button class="iconbtn" id="zin" aria-label="Zoom in">+</button>
        <button class="iconbtn" id="zout" aria-label="Zoom out">−</button>
        <button class="iconbtn" id="zfit" aria-label="Show everything" title="Show everything">⤢</button>
      </div>
      <div class="overlay ov-year" id="ovYear">
        <button class="iconbtn" id="play" aria-label="Play through the years">▶</button>
        <input type="range" id="year" min="1550" max="2026" step="1" value="2026" aria-label="Show places up to this year">
        <span class="yr" id="yearLabel">All</span>
      </div>
      <div class="overlay ov-hint" id="ovHint" hidden>Tap the map where you are</div>
      <div class="overlay ov-tree" id="ovTree" hidden></div>
      <div class="tip" id="tip" hidden></div>
    </section>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script>
(() => {
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

let D;                       // site data
const S = {                  // UI state
  tab: "map", stage: "map", person: null, story: null, place: null,
  lines: new Set(), year: null, me: null, picking: false, fanRoot: null,
};
const EVT = { birth: "Born", death: "Died", burial: "Buried", marriage: "Married", residence: "Lived",
  arrival: "Arrived", departure: "Departed", naturalization: "Naturalized", other: "Event" };
const STATUS = {
  documented: ["Documented", "At least one record (census, passenger list, draft card and so on) is cited."],
  unsourced: ["No records cited", "Copied from family trees without a record. Probably right, but unconfirmed."],
  questionable: ["Questionable", "Something about this person, or the link to their child, doesn't add up."],
  proven: ["Documented", ""], "partly-proven": ["Partly documented", ""], tradition: ["Family tradition", ""], "needs-proof": ["Key link unproven", ""],
};

// ------------------------------------------------------------ helpers
const P = id => D.people[id];
const lineColor = k => css("--" + (k || "muted")) || css("--muted");
const lineLabel = k => (D.lines.find(l => l.key === k) || {}).label || "";
const yearsOf = p => {
  const b = p.birth?.year, d = p.death?.year;
  if (b && d) return `${b}–${d}`;
  if (b) return `b. ${b}`;
  if (d) return `d. ${d}`;
  return "";
};
const shortPlace = s => s ? s.split(", ").slice(0, 2).join(", ") : "";
const capital = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const relText = p => p.rel ? capital(p.rel) + (p.line ? ` · ${lineLabel(p.line)} line` : "") : (p.line ? `Relative · ${lineLabel(p.line)} line` : "Relative");
function personLink(id, extra = "") {
  const p = P(id); if (!p) return "";
  return `<a class="chip" href="#${id}"><span class="swatch" style="background:${lineColor(p.line)}"></span>${esc(p.name.display)}<span class="muted small mono">${esc(yearsOf(p))}</span>${extra}</a>`;
}
function personRow(id, meta) {
  const p = P(id);
  const flag = p.status === "questionable" ? ` <span class="flagdot" title="Questionable">?</span>` : "";
  return `<li><a class="prow" href="#${id}"><span class="swatch" style="background:${lineColor(p.line)}"></span>
    <span class="pname">${esc(p.name.display)}${flag}</span><span class="yrs">${esc(yearsOf(p))}</span>
    <span class="pmeta">${esc(meta ?? relText(p))}</span></a></li>`;
}
function parentsOf(id) { const out = []; for (const f of Object.values(D.families)) if (f.children.includes(id)) out.push(...f.partners); return out; }
function familiesAs(id) { return Object.values(D.families).filter(f => f.partners.includes(id)); }
function fatherMother(id) {
  let fa = null, mo = null;
  for (const f of Object.values(D.families)) if (f.children.includes(id)) for (const x of f.partners) {
    if (P(x).sex === "F") mo = mo || x; else fa = fa || x;
  }
  return [fa, mo];
}
function lifeEvents(p) {
  const evs = [];
  if (p.birth) evs.push(p.birth);
  for (const e of p.events) evs.push(e);
  for (const f of familiesAs(p.id)) if (f.marriage) {
    const other = f.partners.find(x => x !== p.id);
    evs.push({ ...f.marriage, type: "marriage", spouse: other });
  }
  if (p.death) evs.push(p.death);
  if (p.burial) evs.push(p.burial);
  const rank = { birth: 0, death: 8, burial: 9 };
  return evs.map((e, i) => ({ e, i })).sort((a, b) => {

// ------------------------------------------------------------ fan chart
const FAN_DEPTH = 8;
function drawFan() {
  const svgEl = $("#fan"), r = $("#stage").getBoundingClientRect();
  if (!r.width) return;
  const svg = d3.select(svgEl); svg.selectAll("*").remove();
  const W = r.width, H = r.height;
  const span = 240 * Math.PI / 180, a0 = -span / 2;
  // radius budget: the fan's bounding box is 2R wide and R(1+cos(30°))... fit it
  const R = Math.max(140, Math.min(W / 2 - 16, (H - 70) / (1 + Math.cos(Math.PI / 6))));
  const cx = W / 2, cy = 56 + R;
  const weights = [1.25, 1.15, 1.1, 1.05, 1, .9, .8, .7, .6];
  const depth = S.fanRoot ? FAN_DEPTH - 1 : FAN_DEPTH;
  const wsum = weights.slice(0, depth + 1).reduce((a, b) => a + b, 0);
  const ring = []; let acc = 0;
  for (let d = 0; d <= depth; d++) { ring.push([acc / wsum * R, (acc + weights[d]) / wsum * R]); acc += weights[d]; }

  const defs = svg.append("defs");
  defs.append("pattern").attr("id", "hatch").attr("patternUnits", "userSpaceOnUse").attr("width", 6).attr("height", 6).attr("patternTransform", "rotate(45)")
    .append("line").attr("x1", 0).attr("y1", 0).attr("x2", 0).attr("y2", 6).attr("stroke", css("--ink")).attr("stroke-opacity", .35).attr("stroke-width", 1.4);
  svg.append("rect").attr("class", "treebg").attr("width", W).attr("height", H);
  const g = svg.append("g").attr("class", "fan").attr("transform", `translate(${cx},${cy})`);

  // nodes: {id, private, depth, a0, a1}
  const nodes = [];
  function place(id, depth, s0, s1, privateLabel) {
    nodes.push({ id, depth, s0, s1, privateLabel });
    if (depth >= ring.length - 1) return;
    let fa = null, mo = null;
    if (id) [fa, mo] = fatherMother(id);
    else if (privateLabel === "root") { fa = "__pw"; mo = "__pp"; }
    else if (privateLabel === "Winters") [fa, mo] = ["I32188196736", "I32188196737"];
    else if (privateLabel === "Papesch") [fa, mo] = ["I410184298012", "I410184298024"];
    if (!id && privateLabel !== "root" && privateLabel !== "Winters" && privateLabel !== "Papesch") return;
    const mid = (s0 + s1) / 2;
    const kid = (x, a, b) => x === "__pw" ? place(null, depth + 1, a, b, "Winters") : x === "__pp" ? place(null, depth + 1, a, b, "Papesch") : place(x && P(x) ? x : null, depth + 1, a, b, x ? null : "empty");

  }

  const arc = d3.arc();
  const tint = (col, d) => `color-mix(in srgb, ${col} ${Math.max(28, 92 - d * 9)}%, var(--paper))`;
  for (const n of nodes) {
    if (n.depth === 0) continue;
    const [ri, ro] = ring[n.depth];
    const dpath = arc({ innerRadius: ri, outerRadius: ro, startAngle: n.s0, endAngle: n.s1 });
    const p = n.id ? P(n.id) : null;
    const el = g.append("path").attr("d", dpath).attr("class", "w");
    if (p) {
      el.attr("fill", tint(lineColor(p.line), n.depth)).classed("sel", S.person === n.id)
        .on("click", () => { location.hash = n.id; })
        .on("mouseenter", ev => showTip(ev, `<b>${esc(p.name.display)}</b>${esc(yearsOf(p))}<br>${esc(relText(p))}`))
        .on("mousemove", moveTip).on("mouseleave", hideTip);
      el.append("title").text(`${p.name.display} ${yearsOf(p)}`);
      if (p.status === "questionable") g.append("path").attr("d", dpath).attr("class", "hatch").attr("fill", "url(#hatch)");
    } else if (n.privateLabel === "Winters" || n.privateLabel === "Papesch") {
      el.attr("class", "w private");
    } else {
      el.attr("class", "w empty");
    }
    // labels
    const ang = (n.s0 + n.s1) / 2, sweep = n.s1 - n.s0, rm = (ri + ro) / 2, thick = ro - ri;
    const label = p ? p.name : (n.privateLabel === "Winters" || n.privateLabel === "Papesch") ? { given: "Parent", surname: "(living)" } : null;
    if (!label) continue;
    const arcLen = sweep * rm;
    if (n.depth <= 3 && arcLen > 60) {
      // along the arc
      const deg = ang * 180 / Math.PI;
      const flip = Math.abs(deg) > 90;
      const g2 = g.append("g").attr("transform", `rotate(${deg}) translate(0,${-rm}) rotate(${flip ? 180 : 0})`);
      const maxChars = Math.floor(arcLen / 7.5);
      const fs = n.depth === 1 ? 14 : n.depth === 2 ? 13 : 12;
      const nm = (label.given ? label.given.replace(/'.*?'/g, "").trim().split(" ")[0] + " " : "") + (label.surname || "");
      g2.append("text").attr("class", "n").attr("text-anchor", "middle").attr("font-size", fs).attr("dy", p ? -2 : 4).text(trunc(nm, maxChars));
      if (p) g2.append("text").attr("class", "y").attr("text-anchor", "middle").attr("font-size", 10.5).attr("dy", 12).text(yearsOf(p));
    } else if (sweep * ri > 7 && thick > 30) {
      // radial
      let deg = ang * 180 / Math.PI - 90;
      const flip = ang > 0 ? false : true;
      const fs = Math.min(11.5, sweep * rm * 0.55);
      const g2 = g.append("g").attr("transform", `rotate(${deg}) translate(${rm},0) rotate(${flip ? 180 : 0})`);
      const maxChars = Math.floor(thick / (fs * 0.55));
      const nm = (label.given ? label.given.replace(/'.*?'/g, "").trim().split(" ")[0] + " " : "") + (label.surname || "");
      g2.append("text").attr("class", "n").attr("text-anchor", "middle").attr("dy", "0.35em").attr("font-size", fs).text(trunc(nm, maxChars));
    }
  }
  // center
  const c = g.append("g").attr("class", "center");
  const [, r0] = ring[0];
  const rootP = S.fanRoot ? P(S.fanRoot) : null;
  c.append("circle").attr("r", r0 - 2).attr("fill", rootP ? tint(lineColor(rootP.line), 0) : css("--panel")).attr("stroke", css("--rule"));
  const ct = rootP ? [rootP.name.given?.replace(/'.*?'/g, "").trim() || "", rootP.name.surname || ""] : ["The", "grandchildren"];
  const cfs = Math.max(10, Math.min(16, r0 / 4.6));

  c.append("text").attr("text-anchor", "middle").attr("dy", cfs * 1.0).attr("font-size", cfs).text(trunc(ct[1], 14));

  // overlay: reset + legend
  $("#ovTree").innerHTML = `${S.fanRoot ? `<button class="btn" id="fanReset">← Back to the grandchildren</button>` : ""}
    <div class="legend"><span><span class="swatch" style="background:var(--winters)"></span> Winters</span><span><span class="swatch" style="background:var(--creamer)"></span> Creamer</span><span><span class="swatch" style="background:var(--papesch)"></span> Papesch</span><span><span class="swatch" style="background:var(--rusin)"></span> Rusin</span><span>Hatched: questionable</span><span>Dashed: unknown</span></div>`;
  const rb = $("#fanReset"); if (rb) rb.onclick = () => { S.fanRoot = null; drawFan(); };
}
const trunc = (s, n) => (s.length > n ? s.slice(0, Math.max(1, n - 1)) + "…" : s);

    const k = b.dataset.only;
    const only = S.lines.size === 1 && S.lines.has(k);
    S.lines = new Set(only ? D.lines.map(l => l.key).concat("none") : [k]);
    document.querySelectorAll("#ovLines [data-line]").forEach(c => c.setAttribute("aria-pressed", S.lines.has(c.dataset.line)));
    restyle();
    const keys = M.places.filter(visiblePlace).map(p => p.key);
    flyTo(keys, 30);
  });
}
function storyCard(s) {
  return `<a class="storycard" href="#s-${s.id}"><span class="eyebrow">${esc(s.era)}</span><h3>${esc(s.title)}</h3><p class="small muted">${esc(s.dek)}</p></a>`;
}
function viewStories() {
  setPanel(`<div class="eyebrow">${D.stories.length} stories</div><h1>Stories</h1>
    <p class="lede">Each story follows one family thread. Each one ends with a note on which parts are backed by records.</p>
    <div>${D.stories.map(storyCard).join("")}</div>`);
}
function viewStory(id) {
  const s = D.stories.find(x => x.id === id);
  if (!s) return viewStories();
  const [lab] = STATUS[s.status] || [s.status];
  setPanel(`<button class="back" onclick="location.hash='stories'">← All stories</button>
    <div class="eyebrow">${esc(s.era)}</div><h1>${esc(s.title)}</h1>
    <div class="row"><span class="pill ${s.status}">${esc(lab)}</span></div>
    <p class="lede">${esc(s.dek)}</p>
    <div class="prose">${s.html}</div>
    <div class="section"><h3>People in this story</h3><div class="row">${s.people.map(id => personLink(id)).join("")}</div></div>`);
}
function viewPerson(id) {
  const p = P(id);
  const [st, stHelp] = STATUS[p.status];
  const [fa, mo] = fatherMother(id);
  const fams = familiesAs(id);
  const evs = lifeEvents(p);
  const life = evs.map(e => {
    let what = `<b>${esc(e.type === "other" ? (e.label || "Event") : EVT[e.type])}</b>`;
    if (e.type === "marriage" && e.spouse) what += ` <a href="#${e.spouse}">${esc(P(e.spouse).name.display)}</a>`;
    if (e.place) what += ` · <button class="placebtn" data-place="${esc(e.place)}" ${D.places[e.place] ? "" : "disabled title='Not on the map yet'"}>${esc(shortPlace(e.place))}</button>`;
    if (e.note) what += `<div class="small muted">${esc(e.note)}</div>`;
    return `<li><span class="when">${esc(e.date || "date unknown")}</span><span class="what">${what}</span></li>`;
  }).join("");
  const spouses = fams.map(f => {
    const other = f.partners.find(x => x !== id);
    const kids = f.children.map(c => personLink(c)).join("");
    const hid = f.hiddenChildren ? `<span class="chip muted">${f.hiddenChildren} living ${f.hiddenChildren === 1 ? "child" : "children"} not shown</span>` : "";
    return `<div class="section" style="gap:8px">${other ? `<div class="row"><span class="small muted">With</span> ${personLink(other)}</div>` : ""}
      ${kids || hid ? `<div class="row">${kids}${hid}</div>` : ""}</div>`;
  }).join("");
  const stories = D.stories.filter(s => s.people.includes(id));
  const flags = p.flags.map(f => `<div class="note ${f.level === "questionable" ? "q" : ""}">${esc(f.text)}</div>`).join("");
  setPanel(`
    <div class="eyebrow" style="color:${lineColor(p.line)}">${esc(relText(p))}</div>
    <h1>${esc(p.name.display)}</h1>
    <div class="row"><span class="mono muted">${esc(yearsOf(p))}</span><span class="pill ${p.status}" title="${esc(stHelp)}">${esc(st)}</span></div>
    ${p.name.variants.length ? `<p class="small muted">Also recorded as ${p.name.variants.map(esc).join(", ")}</p>` : ""}
    ${flags}
    <div class="row">
      ${evs.some(e => D.places[e.place]) ? `<button class="btn" id="showMap">Show life on the map</button>` : ""}
      <button class="btn" id="centerFan">Center the tree here</button>
    </div>
    ${stories.length ? `<div class="section"><h3>In the stories</h3>${stories.map(storyCard).join("")}</div>` : ""}
    <div class="section"><h3>Life</h3>${life ? `<ul class="life">${life}</ul>` : `<p class="muted">No dates or places recorded.</p>`}</div>
    <div class="section"><h3>Family</h3>
      ${fa || mo ? `<div class="row"><span class="small muted">Parents</span> ${[fa, mo].filter(Boolean).map(x => personLink(x)).join("")}</div>` : `<p class="small muted">Parents not known.</p>`}
      ${spouses}
    </div>
    ${p.notes.length ? `<div class="section"><h3>Notes</h3>${p.notes.map(n => `<p class="small">${esc(n)}</p>`).join("")}</div>` : ""}
    ${p.conflicts.length ? `<div class="section"><h3>Records disagree</h3>${p.conflicts.map(n => `<p class="small">${esc(n)}</p>`).join("")}</div>` : ""}
    ${p.media.length ? `<div class="section"><h3>Attached on Ancestry</h3><p class="small muted">${p.media.map(esc).join(" · ")}</p></div>` : ""}
    <details ${p.sources.length ? "" : "hidden"}><summary>${p.sources.length} source${p.sources.length === 1 ? "" : "s"}</summary>
      <ul class="srcs">${p.sources.map(s => `<li>${esc(s.title)}${s.detail ? `<span>${esc(s.detail)}</span>` : ""}</li>`).join("")}</ul></details>
  `);
  const sm = $("#showMap"); if (sm) sm.onclick = () => { if (S.stage !== "map") { setStage("map"); setTab("map", false); } flyTo(evs.map(e => e.place)); };
  $("#centerFan").onclick = () => { S.fanRoot = id; setTab("tree", false); setStage("fan"); };
}
function openPlace(key) {
  S.place = key; S.person = null; S.story = null;
  drawRoute(); restyle();
  const pl = D.places[key];
  const byPerson = new Map();
  for (const e of pl.events) { if (!byPerson.has(e.p)) byPerson.set(e.p, []); byPerson.get(e.p).push(e); }
  const rows = [...byPerson.entries()].sort((a, b) => (Math.min(...a[1].map(e => e.y ?? 9999))) - (Math.min(...b[1].map(e => e.y ?? 9999))))
    .map(([id, es]) => personRow(id, es.map(e => `${EVT[e.t] || "Event"}${e.y ? " " + e.y : ""}`).join(" · "))).join("");
  const prec = { town: "", county: "Mapped to the county.", region: "Mapped to the state or region.", country: "Only the country is known." }[pl.precision] || "";
  setPanel(`<button class="back" id="placeBack">← Back</button><div class="eyebrow">Place</div><h1>${esc(pl.label)}</h1>
    <p class="muted">${esc(key.split(", ").slice(1).join(", "))}</p>
    ${prec ? `<p class="small muted">${prec}</p>` : ""}
    <div class="row"><a class="btn" target="_blank" rel="noopener" href="https://www.openstreetmap.org/?mlat=${pl.lat}&mlon=${pl.lon}#map=${pl.precision === "town" ? 13 : 9}/${pl.lat}/${pl.lon}">Open in OpenStreetMap</a></div>
    <div class="section"><h3>${byPerson.size} ${byPerson.size === 1 ? "person" : "people"} here</h3><ul class="list">${rows}</ul></div>`);
  $("#placeBack").onclick = () => route();
  S.scrollPanel = true;
}
function viewPeople() {
  const q = S.peopleQuery || "";
  setPanel(`<div class="eyebrow">${Object.keys(D.people).length} people</div><h1>People</h1>
    <input type="search" id="pq" placeholder="Search names or places" value="${esc(q)}" autocomplete="off">
    <div class="row" id="pf">${D.lines.map(l => `<button class="chip" data-f="${l.key}" aria-pressed="${!(S.peopleOff || new Set()).has(l.key)}"><span class="swatch" style="background:${lineColor(l.key)}"></span>${esc(l.label)}</button>`).join("")}</div>
    <ul class="list" id="plist"></ul>`);
  const render = () => {
    const qq = $("#pq").value.trim().toLowerCase(); S.peopleQuery = qq;
    const off = S.peopleOff || new Set();
    const list = Object.values(D.people).filter(p => !off.has(p.line) && (!qq ||
      [p.name.display, ...p.name.variants, p.birth?.place, p.death?.place].join(" ").toLowerCase().includes(qq)))
      .sort((a, b) => (a.gen ?? 99) - (b.gen ?? 99) || (a.birth?.year ?? 3000) - (b.birth?.year ?? 3000));
    $("#plist").innerHTML = list.map(p => personRow(p.id)).join("") || `<li class="muted" style="padding:10px 0">No one matches “${esc(qq)}”.</li>`;
  };
  $("#pq").addEventListener("input", render);
  $("#pf").addEventListener("click", ev => {
    const b = ev.target.closest("[data-f]"); if (!b) return;
    S.peopleOff = S.peopleOff || new Set();
    const k = b.dataset.f; S.peopleOff.has(k) ? S.peopleOff.delete(k) : S.peopleOff.add(k);
    b.setAttribute("aria-pressed", !S.peopleOff.has(k)); render();
  });
  render();
}
const QUICK = [["Palermo", 38.1157, 13.3615], ["Vienna", 48.2082, 16.3738], ["Basel", 47.5596, 7.5886], ["London", 51.5074, -0.1278],
  ["Edinburgh", 55.9533, -3.1883], ["Kraków", 50.0647, 19.945], ["Boston", 42.3601, -71.0589], ["Chicago", 41.8781, -87.6298],
  ["Denver", 39.7392, -104.9903], ["Dallas", 32.7767, -96.797], ["Oklahoma City", 35.4676, -97.5164], ["Nashville", 36.1627, -86.7816]];
function viewNear() {
  setPanel(`<div class="eyebrow">Travelling?</div><h1>Near me</h1>
    <p class="lede">Find the ancestral places closest to where you are.</p>
    <div class="row"><button class="btn primary" id="geo">Use my location</button><button class="btn" id="pick">Tap the map instead</button></div>
    <p class="small muted" id="geoMsg"></p>
    <div class="row">${QUICK.map(([n]) => `<button class="chip" data-q="${esc(n)}">${esc(n)}</button>`).join("")}</div>
    <div id="nearOut"></div>`);
  $("#geo").onclick = () => {
    const msg = $("#geoMsg");
    if (!navigator.geolocation) { msg.textContent = "This browser can't share your location. Tap the map or pick a city instead."; return; }
    msg.textContent = "Asking for your location…";
    navigator.geolocation.getCurrentPosition(
      pos => { msg.textContent = ""; setMe({ lat: pos.coords.latitude, lon: pos.coords.longitude, label: "your location" }); },
      () => { msg.textContent = "Location isn't available here. Tap the map where you are, or pick a nearby city."; },
      { enableHighAccuracy: false, timeout: 10000, maximumAge: 600000 });
  };
  $("#pick").onclick = () => { S.picking = true; $("#ovHint").hidden = false; $("#geoMsg").textContent = "Now tap the map where you are. Zoom in first for accuracy."; };
  $("#panelInner").querySelectorAll("[data-q]").forEach(b => b.onclick = () => {
    const [n, lat, lon] = QUICK.find(x => x[0] === b.dataset.q); setMe({ lat, lon, label: n });
  });
  if (S.me) renderNear();
}
function setMe(me) {
  S.me = me; S.picking = false; $("#ovHint").hidden = true;
  drawMe();
  if (S.tab !== "near") { location.hash = "near"; return; }
  renderNear();
}
function renderNear() {
  const out = $("#nearOut"); if (!out) return;
  const cands = Object.entries(D.places).filter(([, pl]) => pl.precision === "town" || pl.precision === "county")
    .map(([key, pl]) => ({ key, pl, km: haversine(S.me, pl) })).sort((a, b) => a.km - b.km).slice(0, 12);
  const near = cands[0];
  const fmt = km => km < 1 ? "here" : km < 10 ? `${km.toFixed(1)} km · ${(km * 0.621).toFixed(1)} mi` : `${Math.round(km)} km · ${Math.round(km * 0.621)} mi`;
  const head = near.km < 60 ? `You're ${fmt(near.km).split(" · ")[0]} from ${esc(near.key.split(", ")[0])}.` :
    near.km < 300 ? `The nearest family place is ${esc(near.key.split(", ")[0])}, ${fmt(near.km).split(" · ")[0]} away.` :
    `No family places nearby. The closest is ${esc(near.key.split(", ")[0])}, ${fmt(near.km).split(" · ")[0]} away.`;
  out.innerHTML = `<div class="section"><h3>From ${esc(S.me.label)}</h3><p>${head}</p><ul class="list">${cands.map(c => {
    const who = [...new Set(c.pl.events.map(e => e.p))];
    const unproven = who.every(id => P(id).status === "questionable");
    const what = c.pl.events.slice(0, 3).map(e => `${P(e.p).name.short} ${(EVT[e.t] || "").toLowerCase()}${e.y ? " " + e.y : ""}`).join("; ");
    return `<li><button class="prow" style="width:100%;background:none;border:0;cursor:pointer;text-align:left" data-place="${esc(c.key)}">
      <span class="swatch" style="background:${lineColor(P(who[0]).line)}"></span><span class="pname">${esc(c.key.split(", ")[0])}${unproven ? ` <span class="pill questionable" style="font-size:.6rem;padding:3px 6px">unproven branch</span>` : ""}</span>
      <span class="yrs">${fmt(c.km)}</span><span class="pmeta">${esc(what)}${c.pl.events.length > 3 ? " …" : ""}</span></button></li>`;
  }).join("")}</ul></div>`;
  flyTo(cands.slice(0, near.km < 300 ? 4 : 1).map(c => c.key));
}
function viewAbout() {
  const ppl = Object.values(D.people);
  const n = s => ppl.filter(p => p.status === s).length;
  const flagged = ppl.filter(p => p.flags.length).sort((a, b) => (a.gen ?? 99) - (b.gen ?? 99));
  setPanel(`<div class="eyebrow">About</div><h1>How to read this atlas</h1>
    <div class="prose small">
      <p>This atlas grew out of a family tree kept on Ancestry.com. Relationships are written from the point of view of the <strong>grandchildren</strong> of Richard &amp; Joyce Winters and Roger &amp; Elaine Papesch, so “great-grandfather” means a grandparent's grandparent. Living members of the youngest generations aren't shown.</p>
      <p>Older family trees often copy each other's mistakes. Every person has a status, so you can tell what's backed by records:</p>
    </div>
    <ul class="list">
      <li class="prow" style="grid-template-columns:auto 1fr"><span class="pill documented">Documented</span><span class="small">${n("documented")} people cite at least one record (census, passenger list, draft card, etc.).</span></li>
      <li class="prow" style="grid-template-columns:auto 1fr"><span class="pill unsourced">No records cited</span><span class="small">${n("unsourced")} people come from family trees without a record. Probably right, but unconfirmed.</span></li>
      <li class="prow" style="grid-template-columns:auto 1fr"><span class="pill questionable">Questionable</span><span class="small">${n("questionable")} people have impossible dates, or sit above a link that looks like a guess. On the tree they're hatched.</span></li>
    </ul>
    <div class="section"><h3>Open questions</h3><p class="small muted">These are the links most worth researching. Each one decides whether a whole branch is real.</p>
      <ul class="list">${flagged.filter(p => p.flags.some(f => !f.text.startsWith("This branch rests"))).map(p => personRow(p.id, p.flags.find(f => !f.text.startsWith("This branch rests")).text)).join("")}</ul></div>
    <div class="section"><h3>What we've corrected</h3><ul class="list">${D.changes.map(c => `<li class="small" style="padding:8px 0">${esc(c.text)}</li>`).join("")}</ul></div>
    <div class="section"><h3>Credits</h3><p class="small muted">Place coordinates come from OpenStreetMap (Nominatim). Country and U.S. state outlines come from Natural Earth and the U.S. Census Bureau. Data updated ${esc(D.built)}.</p></div>`);
}

// ------------------------------------------------------------ routing
function setTab(tab, render = true) {
  S.tab = tab;
  document.querySelectorAll("nav.tabs a").forEach(a => { if (a.dataset.tab === tab) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
}
function route() {
  const h = decodeURIComponent(location.hash.slice(1)) || "map";
  hideTip();
  if (/^I\d+$/.test(h) && D.people[h]) {
    S.person = h; S.story = null; S.place = null;
    drawRoute(); restyle();
    viewPerson(h);
    if (S.stage === "fan") drawFan();
    else flyTo(lifeEvents(P(h)).map(e => e.place));
    S.scrollPanel = true;
    return;
  }
  if (h.startsWith("s-")) {
    const st = D.stories.find(s => s.id === h.slice(2));
    setTab("stories"); setStage("map");
    S.story = st ? st.id : null; S.person = null; S.place = null;
    drawRoute(); restyle(); viewStory(h.slice(2));
    if (st) flyTo(st.places, 14);
    return;
  }
  const tab = ["map", "tree", "stories", "people", "near", "about"].includes(h) ? h : "map";
  setTab(tab);
  S.person = null; S.story = null; S.place = null; drawRoute(); restyle();
  if (tab === "map" && M.focus) fitAll();
  setStage(tab === "tree" ? "fan" : "map");
  ({ map: viewHome, tree: viewTreeHelp, stories: viewStories, people: viewPeople, near: viewNear, about: viewAbout })[tab]();
}
function viewTreeHelp() {
  setPanel(`<div class="eyebrow">Tree</div><h1>The fan chart</h1>
    <p class="lede">The grandchildren are at the centre. Each ring out is one generation further back: fathers on the left half of each wedge, mothers on the right.</p>
    <div class="prose small"><p>Tap anyone to read about them. Use “Center the tree here” on their page to see their own ancestors further back.</p>
    <p>Hatched wedges are questionable. Dashed ones are ancestors nobody has identified yet, and there's room to find them.</p></div>
    <div class="section"><h3>The grandparents</h3><ul class="list">${D.lines.map(l => personRow(l.grandparent)).join("")}</ul></div>`);
}

// ------------------------------------------------------------ boot
async function boot() {
  let world, us;
  try {
    [D, world, us] = await Promise.all(["data.json", "geo/countries-50m.json", "geo/states-10m.json"].map(u => fetch(u).then(r => { if (!r.ok) throw new Error(u); return r.json(); })));
  } catch (e) {
    $("#panelInner").innerHTML = `<h2>The atlas couldn't load</h2><p class="muted">Reload the page to try again.</p>`;
    return;
  }
  S.lines = new Set(D.lines.map(l => l.key).concat("none"));
  buildOverlay();
  buildMap(world, us);
  window.addEventListener("hashchange", route);
  // any place name in the panel opens that place on the map
  $("#panelInner").addEventListener("click", ev => {
    const b = ev.target.closest("[data-place]");
    if (!b || !D.places[b.dataset.place]) return;
    if (S.stage !== "map") { setStage("map"); setTab("map"); }
    const keep = S.tab === "near";
    openPlace(b.dataset.place);
    if (keep) S.tab = "near";
    flyTo([b.dataset.place], 30);
  });
  route();
}
boot();
})();
</script>
